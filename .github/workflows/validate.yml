name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanitize-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check workflow JSON is sanitized
        run: python3 scripts/check_sanitized.py
      - name: Check docs, examples and scripts are sanitized
        run: python3 scripts/check_docs_sanitized.py
